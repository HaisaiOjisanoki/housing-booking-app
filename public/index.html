<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unaccompanied Housing - Appointment Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Unaccompanied Housing Appointment Booking</h4>
                    </div>
                    <div class="card-body">
                        <form id="bookingForm" onsubmit="handleBooking(event)">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="branch" class="form-label">Branch of Service</label>
                                <select class="form-select" id="branch" required>
                                    <option value="">Select Branch...</option>
                                    <option value="USMC">USMC</option>
                                    <option value="USA">USA</option>
                                    <option value="USN">USN</option>
                                    <option value="USAF">USAF</option>
                                    <option value="USCG">USCG</option>
                                    <option value="USSF">USSF</option>
                                </select>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="campLocation" class="form-label">Camp Location</label>
                                    <select class="form-select" id="campLocation" required>
                                        <option value="">Select Camp...</option>
                                        <option value="Camp Foster">Camp Foster</option>
                                        <option value="Camp Hansen">Camp Hansen</option>
                                        <option value="Camp Schwab">Camp Schwab</option>
                                        <option value="MCAS Futenma">MCAS Futenma</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="buildingNumber" class="form-label">Building Number</label>
                                    <input type="text" class="form-control" id="buildingNumber" placeholder="e.g., Bldg 100" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="visitPurpose" class="form-label">Visit Purpose</label>
                                <input type="text" class="form-control" id="visitPurpose" placeholder="e.g., Check-in, Maintenance, Checkout" required>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="appointmentDate" class="form-label">Appointment Date</label>
                                    <input type="date" class="form-control" id="appointmentDate" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="timeSlot" class="form-label">Time Slot</label>
                                    <select class="form-select" id="timeSlot" required>
                                        <option value="">Select Time Slot...</option>
                                        <option value="0800-0900">0800 - 0900</option>
                                        <option value="0900-1000">0900 - 1000</option>
                                        <option value="1000-1100">1000 - 1100</option>
                                        <option value="1300-1400">1300 - 1400</option>
                                        <option value="1400-1500">1400 - 1500</option>
                                    </select>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Submit Booking</button>
                        </form>
                        <div id="confirmationResult" class="mt-4" style="display:none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function handleBooking(event) {
            event.preventDefault();
            const code = 'UH-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            const resultDiv = document.getElementById('confirmationResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'alert alert-success';
            resultDiv.innerHTML = `<h5>Appointment Confirmed!</h5><p>Your unique confirmation code is: <strong>${code}</strong>. Please save this reference code to manage your appointment[cite: 14].</p>`;
        }
    </script>
</body>
</html>
