<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unaccompanied Housing (UH) Management Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#" onclick="switchView('public')">UH Portal</a>
            <div class="d-flex">
                <button class="btn btn-outline-light btn-sm" onclick="openLoginModal()">Staff Sign In</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-4">
        
        <!-- Public Booking View -->
        <div id="public-view" class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Schedule Housing Appointment</h4>
                    </div>
                    <div class="card-body">
                        <form id="booking-form" onsubmit="submitBooking(event)">
                            <div class="mb-3">
                                <label class="form-label">Service Member Name</label>
                                <input type="text" class="form-control" id="sm-name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Rank</label>
                                <select class="form-select" id="sm-rank">
                                    <option value="E-1">E-1</option>
                                    <option value="E-2">E-2</option>
                                    <option value="E-3">E-3</option>
                                    <option value="E-4">E-4</option>
                                    <option value="E-5">E-5 and above</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contact Email / Phone</label>
                                <input type="text" class="form-control" id="sm-contact" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Camp Location</label>
                                <select class="form-select" id="camp-select" onchange="updateBuildings()" required>
                                    <option value="">Select Camp...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Building / Barracks</label>
                                <select class="form-select" id="building-select" required>
                                    <option value="">Select Building...</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Appointment Date</label>
                                <input type="date" class="form-control" id="appt-date" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Submit Booking</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Staff Dashboard View (Hidden by default) -->
        <div id="dashboard-view" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Staff Management Dashboard</h2>
                <div>
                    <span id="user-badge" class="badge bg-secondary me-2"></span>
                    <button class="btn btn-danger btn-sm" onclick="logout()">Sign Out</button>
                </div>
            </div>
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Appointments</h5>
                    <div class="table-responsive">
                        <table class="table table-striped align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Rank</th>
                                    <th>Camp</th>
                                    <th>Building</th>
                                    <th>Date</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="appointments-table-body">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Staff Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Staff Sign In</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="login-form" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="login-user" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="login-pass" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let appState = {};
        let currentUser = null;

        async function fetchState() {
            const res = await fetch('/api/state');
            appState = await res.json();
            populateCamps();
            if (currentUser) {
                renderDashboard();
            }
        }

        function populateCamps() {
            const campSelect = document.getElementById('camp-select');
            campSelect.innerHTML = '<option value="">Select Camp...</option>';
            appState.camps.forEach(camp => {
                campSelect.innerHTML += `<option value="${camp.name}">${camp.name}</option>`;
            });
        }

        function updateBuildings() {
            const selectedCampName = document.getElementById('camp-select').value;
            const buildingSelect = document.getElementById('building-select');
            buildingSelect.innerHTML = '<option value="">Select Building...</option>';
            
            const camp = appState.camps.find(c => c.name === selectedCampName);
            if (camp) {
                camp.buildings.forEach(b => {
                    buildingSelect.innerHTML += `<option value="${b}">${b}</option>`;
                });
            }
        }

        async function submitBooking(event) {
            event.preventDefault();
            const data = {
                serviceMemberName: document.getElementById('sm-name').value,
                rank: document.getElementById('sm-rank').value,
                contact: document.getElementById('sm-contact').value,
                camp: document.getElementById('camp-select').value,
                building: document.getElementById('building-select').value,
                date: document.getElementById('appt-date').value
            };

            const res = await fetch('/api/appointments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (result.success) {
                alert('Appointment booked successfully! ID: ' + result.appointment.id);
                document.getElementById('booking-form').reset();
            } else {
                alert('Error booking appointment.');
            }
        }

        function openLoginModal() {
            const modal = new bootstrap.Modal(document.getElementById('loginModal'));
            modal.show();
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-user').value;
            const password = document.getElementById('login-pass').value;

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const result = await res.json();

            if (result.success) {
                currentUser = result.user;
                bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
                document.getElementById('login-form').reset();
                switchView('dashboard');
                renderDashboard();
            } else {
                alert('Invalid credentials.');
            }
        }

        function switchView(view) {
            if (view === 'public') {
                document.getElementById('public-view').classList.remove('d-none');
                document.getElementById('dashboard-view').classList.add('d-none');
            } else if (view === 'dashboard') {
                document.getElementById('public-view').classList.add('d-none');
                document.getElementById('dashboard-view').classList.remove('d-none');
            }
        }

        function renderDashboard() {
            document.getElementById('user-badge').innerText = `${currentUser.username} (${currentUser.role})`;
            const tbody = document.getElementById('appointments-table-body');
            tbody.innerHTML = '';

            let appointments = appState.appointments;
            if (currentUser.role !== 'superadmin') {
                appointments = appointments.filter(a => a.camp === currentUser.camp);
            }

            if (appointments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No appointments found.</td></tr>`;
                return;
            }

            appointments.forEach(appt => {
                tbody.innerHTML += `
                    <tr>
                        <td>${appt.id}</td>
                        <td>${appt.serviceMemberName}</td>
                        <td>${appt.rank}</td>
                        <td>${appt.camp}</td>
                        <td>${appt.building}</td>
                        <td>${appt.date}</td>
                        <td><span class="badge bg-warning text-dark">${appt.status}</span></td>
                        <td>
                            <button class="btn btn-success btn-sm" onclick="updateStatus('${appt.id}', 'Confirmed')">Confirm</button>
                            <button class="btn btn-danger btn-sm" onclick="updateStatus('${appt.id}', 'Cancelled')">Cancel</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function updateStatus(id, status) {
            const res = await fetch(`/api/appointments/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            const result = await res.json();
            if (result.success) {
                await fetchState();
            }
        }

        function logout() {
            currentUser = null;
            switchView('public');
        }

        // Initialize App
        fetchState();
    </script>
</body>
</html>
