<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Appointment Booking - Housing Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light" onload="initPublicForm()">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-house-door-fill me-2"></i>Housing Portal - Public Booking</a>
            <button class="btn btn-outline-light btn-sm" onclick="openStaffPortal()"><i class="bi bi-shield-lock me-1"></i>Staff Sign In</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                
                <!-- Status Alert Notification -->
                <div id="publicAlert" class="alert d-none mb-4" role="alert"></div>

                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-calendar-plus me-2"></i>Schedule Housing Appointment</h4>
                        <p class="mb-0 small text-white-50">Select your camp and building synced live with Superadmin records.</p>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Confirmation Code View -->
                        <div id="successAlert" class="alert alert-success d-none mb-4" role="alert">
                            <h5 class="fw-bold mb-1"><i class="bi bi-check-circle-fill me-2"></i>Booking Confirmed!</h5>
                            <p class="mb-1 small">Your confirmation code: <strong id="displayCode" class="fs-5 text-dark"></strong></p>
                            <button class="btn btn-sm btn-outline-success mt-2 w-100 fw-bold" onclick="resetPublicForm()">Book Another Appointment</button>
                        </div>

                        <form id="publicBookingForm" onsubmit="submitPublicBooking(event)">
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label text-muted small">Branch</label>
                                    <select id="pubBranch" class="form-select form-select-sm" required>
                                        <option value="USMC">USMC</option>
                                        <option value="US Army">US Army</option>
                                        <option value="US Navy">US Navy</option>
                                        <option value="US Air Force">US Air Force</option>
                                        <option value="US Space Force">US Space Force</option>
                                        <option value="Civilian">Civilian</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label text-muted small">Last Name</label>
                                    <input type="text" id="pubLastName" class="form-control form-control-sm" required placeholder="Miller">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label text-muted small">First Name</label>
                                    <input type="text" id="pubFirstName" class="form-control form-control-sm" required placeholder="John">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-muted small fw-bold text-primary">Camp Location</label>
                                    <select id="pubCamp" class="form-select form-select-sm border-primary" required onchange="updatePublicBuildingDropdown()">
                                        <option value="">-- Select Camp --</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-muted small fw-bold text-primary">Building Number</label>
                                    <select id="pubBuilding" class="form-select form-select-sm border-primary" required>
                                        <option value="">-- Select Camp First --</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold text-primary">Purpose of Visit</label>
                                <select id="pubPurpose" class="form-select form-select-sm border-primary" required>
                                    <option value="">-- Select Purpose --</option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-muted small">Appointment Date</label>
                                    <input type="date" id="pubDate" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label text-muted small">Appointment Time</label>
                                    <select id="pubTime" class="form-select form-select-sm" required>
                                        <option value="">-- Select Time --</option>
                                        <option value="08:00">08:00 AM</option>
                                        <option value="09:00">09:00 AM</option>
                                        <option value="10:00">10:00 AM</option>
                                        <option value="13:00">01:00 PM</option>
                                        <option value="14:00">02:00 PM</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check-circle me-2"></i>Submit Appointment Request</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let appState = {
            camps: [],
            camp_buildings: {},
            purposes: [],
            staff_users: [],
            bookings: []
        };

        async function initPublicForm() {
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('pubDate');
            if(dateInput) {
                dateInput.min = today;
                dateInput.value = today;
            }

            await fetchServerState();
            setInterval(() => fetchServerState(), 5000); // Live-sync loop
        }

        async function fetchServerState() {
            try {
                const res = await fetch('/api/state');
                if (res.ok) {
                    const data = await res.json();
                    if (data) {
                        appState = data;
                        populatePublicCampsAndPurposes();
                    }
                }
            } catch (err) {
                console.warn("Could not sync with server state.");
            }
        }

        function populatePublicCampsAndPurposes() {
            const camps = Array.isArray(appState.camps) ? appState.camps : [];
            const purposes = Array.isArray(appState.purposes) ? appState.purposes : [];

            const campSelect = document.getElementById('pubCamp');
            if(!campSelect) return;
            const currentCamp = campSelect.value;
            
            campSelect.innerHTML = '<option value="">-- Select Camp --</option>';
            camps.forEach(c => {
                campSelect.innerHTML += `<option value="${c}">${c}</option>`;
            });
            if (currentCamp && camps.includes(currentCamp)) {
                campSelect.value = currentCamp;
            }

            const purposeSelect = document.getElementById('pubPurpose');
            if(purposeSelect) {
                const currentPurpose = purposeSelect.value;
                purposeSelect.innerHTML = '<option value="">-- Select Purpose --</option>';
                purposes.forEach(p => {
                    purposeSelect.innerHTML += `<option value="${p}">${p}</option>`;
                });
                if (currentPurpose) purposeSelect.value = currentPurpose;
            }

            updatePublicBuildingDropdown();
        }

        function updatePublicBuildingDropdown() {
            const campSelect = document.getElementById('pubCamp');
            const buildingSelect = document.getElementById('pubBuilding');
            if (!campSelect || !buildingSelect) return;

            const camp = campSelect.value;
            const currentBldg = buildingSelect.value;

            buildingSelect.innerHTML = '<option value="">-- Select Camp First --</option>';
            if (!camp) return;

            const buildingsMap = appState.camp_buildings || {};
            const bldgs = buildingsMap[camp] || [];

            if (bldgs.length === 0) {
                buildingSelect.innerHTML = '<option value="" disabled>No buildings configured for this camp</option>';
                return;
            }

            buildingSelect.innerHTML = '<option value="">-- Select Building --</option>';
            bldgs.forEach(b => {
                buildingSelect.innerHTML += `<option value="${b}">Bldg ${b}</option>`;
            });

            if (currentBldg && bldgs.includes(currentBldg)) {
                buildingSelect.value = currentBldg;
            }
        }

        async function submitPublicBooking(event) {
            event.preventDefault();

            const code = 'HSG-' + Math.floor(100000 + Math.random() * 900000);
            const newBooking = {
                id: Date.now(),
                confirmationCode: code,
                branch: document.getElementById('pubBranch').value,
                lastName: document.getElementById('pubLastName').value.trim(),
                firstName: document.getElementById('pubFirstName').value.trim(),
                camp: document.getElementById('pubCamp').value,
                building: document.getElementById('pubBuilding').value,
                purpose: document.getElementById('pubPurpose').value,
                date: document.getElementById('pubDate').value,
                time: document.getElementById('pubTime').value,
                status: "Pending",
                username: "public_user"
            };

            if (!Array.isArray(appState.bookings)) appState.bookings = [];
            appState.bookings.push(newBooking);

            try {
                const res = await fetch('/api/state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(appState)
                });
                if (res.ok) {
                    document.getElementById('publicBookingForm').classList.add('d-none');
                    document.getElementById('displayCode').textContent = code;
                    document.getElementById('successAlert').classList.remove('d-none');
                } else {
                    showPublicAlert("Failed to save booking to server.", "danger");
                }
            } catch (err) {
                showPublicAlert("Network connection error.", "danger");
            }
        }

        function resetPublicForm() {
            document.getElementById('publicBookingForm').reset();
            document.getElementById('pubBuilding').innerHTML = '<option value="">-- Select Camp First --</option>';
            document.getElementById('successAlert').classList.add('d-none');
            document.getElementById('publicBookingForm').classList.remove('d-none');
            document.getElementById('pubDate').value = new Date().toISOString().split('T')[0];
        }

        function openStaffPortal() {
            window.location.href = '/login.html';
        }

        function showPublicAlert(message, type) {
            const alert = document.getElementById('publicAlert');
            alert.className = `alert alert-${type} mb-4`;
            alert.textContent = message;
            alert.classList.remove('d-none');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(() => alert.classList.add('d-none'), 6000);
        }
    </script>
</body>
</html>
