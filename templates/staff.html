<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard - UH Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-secondary px-4 mb-4">
        <span class="navbar-brand" id="nav-title">Staff Dashboard</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </nav>

    <div class="container">
        <!-- Staff Navigation Tabs -->
        <ul class="nav nav-tabs mb-4" id="staffTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="staff-appts-tab" data-bs-toggle="tab" data-bs-target="#staff-appointments-view" type="button">Appointments View</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="staff-cal-tab" data-bs-toggle="tab" data-bs-target="#staff-calendar-view" type="button">Calendar View</button>
            </li>
            <li class="nav-item" id="camp-staff-tab-li" style="display: none;" role="presentation">
                <button class="nav-link" id="camp-staff-tab" data-bs-toggle="tab" data-bs-target="#camp-staff-view" type="button">Manage Camp Staff</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- 1. Managed Appointments View -->
            <div class="tab-pane fade show active" id="staff-appointments-view">
                <h3>Managed Appointments</h3>
                <div class="table-responsive bg-white p-3 rounded shadow-sm">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Camp</th>
                                <th>Building</th>
                                <th>Date & Time</th>
                                <th>Purpose</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="staff-appointments-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 2. Managed Calendar View -->
            <div class="tab-pane fade" id="staff-calendar-view">
                <h3>Managed Calendar Schedule</h3>
                <div class="bg-white p-4 rounded shadow-sm" id="staff-calendar-list"></div>
            </div>

            <!-- 3. Camp Admin Staff Management View -->
            <div class="tab-pane fade" id="camp-staff-view">
                <h3>Camp Staff Users</h3>
                <div class="bg-white p-4 rounded shadow-sm mb-4" id="camp-admin-add-staff-box">
                    <h5>Add Staff for Your Camp</h5>
                    <form id="camp-add-staff-form" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="camp-staff-username" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="camp-staff-password" required>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">Add Staff</button>
                        </div>
                    </form>
                </div>
                <div class="table-responsive bg-white p-3 rounded shadow-sm">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Camp</th>
                                <th>Buildings</th>
                            </tr>
                        </thead>
                        <tbody id="camp-staff-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = {};
        let globalState = {};

        async function loadStaffDashboard() {
            try {
                const userRes = await fetch('/api/current_user');
                currentUser = await userRes.json();
                
                document.getElementById('nav-title').innerText = `${currentUser.username.toUpperCase()} Dashboard (${currentUser.role})`;

                if (currentUser.role === 'camp_admin') {
                    document.getElementById('camp-staff-tab-li').style.display = 'block';
                }

                const stateRes = await fetch('/api/state');
                globalState = await stateRes.json();

                renderStaffAppointments();
                renderCampStaff();
            } catch (err) {
                console.error("Error loading staff dashboard:", err);
            }
        }

        function renderStaffAppointments() {
            const bookings = globalState.bookings || [];
            const tbody = document.getElementById('staff-appointments-tbody');
            const calendarList = document.getElementById('staff-calendar-list');
            tbody.innerHTML = '';
            calendarList.innerHTML = '';

            let count = 0;
            bookings.forEach(b => {
                if (currentUser.role === 'camp_admin' && b.camp !== currentUser.camp) return;
                if (currentUser.role === 'staff') {
                    if (b.camp !== currentUser.camp) return;
                    if (currentUser.buildings && currentUser.buildings.length > 0 && !currentUser.buildings.includes(b.building)) return;
                }

                count++;
                const code = b.confirmationCode || b.confirmation_code;
                const statusBadge = `<span class="badge bg-${b.status === 'Confirmed' ? 'success' : b.status === 'Cancelled' ? 'danger' : b.status === 'Rescheduled' ? 'warning text-dark' : 'secondary'}">${b.status || 'Pending'}</span>`;
                
                const actionButtons = `
                    <div class="btn-group btn-group-sm" role="group">
                        <button class="btn btn-outline-success" onclick="updateStatus('${code}', 'Confirmed')">Confirm</button>
                        <button class="btn btn-outline-warning text-dark" onclick="rescheduleBooking('${code}', '${b.date}', '${b.time || ''}')">Reschedule</button>
                        <button class="btn btn-outline-danger" onclick="updateStatus('${code}', 'Cancelled')">Cancel</button>
                    </div>
                `;

                tbody.innerHTML += `
                    <tr>
                        <td><code>${code}</code></td>
                        <td>${b.fullName || b.name || 'N/A'}</td>
                        <td>${b.camp}</td>
                        <td>${b.building}</td>
                        <td>${b.date} ${b.time || ''}</td>
                        <td>${b.purpose}</td>
                        <td>${statusBadge}</td>
                        <td>${actionButtons}</td>
                    </tr>
                `;

                calendarList.innerHTML += `
                    <div class="border-bottom py-2 d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${b.date} at ${b.time || 'All Day'}</strong> - Camp ${b.camp} Bldg ${b.building} (${b.purpose})
                            <span class="text-muted">[User: ${b.fullName || b.name}]</span><br>
                            Status: ${statusBadge}
                        </div>
                        <div>${actionButtons}</div>
                    </div>
                `;
            });

            if (count === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No appointments found for your assigned camp/buildings.</td></tr>`;
                calendarList.innerHTML = `<p class="text-muted">No scheduled events.</p>`;
            }
        }

        function renderCampStaff() {
            if (currentUser.role !== 'camp_admin') return;
            const staffUsers = globalState.staff_users || [];
            const tbody = document.getElementById('camp-staff-tbody');
            tbody.innerHTML = '';

            staffUsers.forEach(u => {
                if (u.camp === currentUser.camp) {
                    tbody.innerHTML += `
                        <tr>
                            <td>${u.username}</td>
                            <td><span class="badge bg-secondary">${u.role}</span></td>
                            <td>${u.camp}</td>
                            <td>${(u.buildings || []).join(', ') || 'All'}</td>
                        </tr>
                    `;
                }
            });
        }

        async function updateStatus(confirmationCode, newStatus, extraData = {}) {
            try {
                const res = await fetch('/api/bookings/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confirmationCode, status: newStatus, ...extraData })
                });

                const data = await res.json();
                if (!res.ok || data.status !== 'success') {
                    alert('Permission denied or update failed: ' + (data.error || 'Forbidden'));
                }
                loadStaffDashboard();
            } catch (err) {
                console.error('Network error:', err);
            }
        }

        function rescheduleBooking(confirmationCode, currentDate, currentTime) {
            const newDate = prompt("Enter new date (YYYY-MM-DD):", currentDate);
            if (!newDate) return;
            const newTime = prompt("Enter new time (HH:MM):", currentTime);
            if (newTime === null) return;

            updateStatus(confirmationCode, 'Rescheduled', { date: newDate, time: newTime });
        }

        // Camp Admin Add Staff Form
        const campAddStaffForm = document.getElementById('camp-add-staff-form');
        if (campAddStaffForm) {
            campAddStaffForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                const newStaff = {
                    username: document.getElementById('camp-staff-username').value.trim(),
                    password: document.getElementById('camp-staff-password').value.trim(),
                    role: 'staff',
                    camp: currentUser.camp,
                    buildings: []
                };

                globalState.staff_users.push(newStaff);
                await fetch('/api/state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(globalState)
                });
                this.reset();
                loadStaffDashboard();
            });
        }

        loadStaffDashboard();
    </script>
</body>
</html>
