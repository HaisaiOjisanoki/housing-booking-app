<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard - UH Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-secondary px-4 mb-4">
        <span class="navbar-brand" id="nav-title">Staff Dashboard</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </nav>

    <div class="container">
        <!-- View Toggle Tabs -->
        <ul class="nav nav-tabs mb-4" id="staffTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="staff-appts-tab" data-bs-toggle="tab" data-bs-target="#staff-appointments-view" type="button">Appointment View</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="staff-cal-tab" data-bs-toggle="tab" data-bs-target="#staff-calendar-view" type="button">Calendar View</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- Appointment Table View -->
            <div class="tab-pane fade show active" id="staff-appointments-view">
                <h3>Managed Appointments</h3>
                <div class="table-responsive bg-white p-3 rounded shadow-sm">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Camp</th>
                                <th>Building</th>
                                <th>Date & Time</th>
                                <th>Purpose</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="staff-appointments-tbody">
                            <!-- Populated dynamically based on user role boundaries -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Calendar View -->
            <div class="tab-pane fade" id="staff-calendar-view">
                <h3>Managed Calendar Schedule</h3>
                <div class="bg-white p-4 rounded shadow-sm" id="staff-calendar-list">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadStaffDashboard() {
            try {
                const userRes = await fetch('/api/current_user');
                const currentUser = await userRes.json();
                
                document.getElementById('nav-title').innerText = `${currentUser.username.toUpperCase()} Dashboard (${currentUser.role})`;

                const stateRes = await fetch('/api/state');
                const state = await stateRes.json();
                const bookings = state.bookings || [];

                const tbody = document.getElementById('staff-appointments-tbody');
                const calendarList = document.getElementById('staff-calendar-list');
                tbody.innerHTML = '';
                calendarList.innerHTML = '';

                bookings.forEach(b => {
                    // Enforce view boundaries on frontend to match backend security checks
                    if (currentUser.role === 'camp_admin' && b.camp !== currentUser.camp) return;
                    if (currentUser.role === 'staff') {
                        if (b.camp !== currentUser.camp) return;
                        if (currentUser.buildings && currentUser.buildings.length > 0 && !currentUser.buildings.includes(b.building)) return;
                    }

                    const code = b.confirmationCode || b.confirmation_code;
                    const statusDropdown = `
                        <select class="form-select form-select-sm status-update-select" data-code="${code}">
                            <option value="Pending" ${b.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Confirmed" ${b.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="Completed" ${b.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            <option value="Cancelled" ${b.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    `;

                    tbody.innerHTML += `
                        <tr>
                            <td><code>${code}</code></td>
                            <td>${b.fullName || b.name || 'N/A'}</td>
                            <td>${b.camp}</td>
                            <td>${b.building}</td>
                            <td>${b.date} ${b.time || ''}</td>
                            <td>${b.purpose}</td>
                            <td>${statusDropdown}</td>
                        </tr>
                    `;

                    calendarList.innerHTML += `
                        <div class="border-bottom py-2 d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${b.date} at ${b.time || 'All Day'}</strong> - Camp ${b.camp} Bldg ${b.building} (${b.purpose})
                                <span class="text-muted">[User: ${b.fullName || b.name}]</span>
                            </div>
                            <div>${statusDropdown}</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error loading staff dashboard:", err);
            }
        }

        document.addEventListener('change', async function(e) {
            if (e.target && e.target.classList.contains('status-update-select')) {
                const confirmationCode = e.target.getAttribute('data-code');
                const newStatus = e.target.value;

                const res = await fetch('/api/bookings/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confirmationCode, status: newStatus })
                });

                const data = await res.json();
                if (!res.ok || data.status !== 'success') {
                    alert('Permission denied or update failed: ' + (data.error || 'Forbidden'));
                    loadStaffDashboard();
                } else {
                    document.querySelectorAll(`[data-code="${confirmationCode}"]`).forEach(el => {
                        el.value = newStatus;
                    });
                }
            }
        });

        loadStaffDashboard();
    </script>
</body>
</html>
