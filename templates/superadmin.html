<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Superadmin Dashboard - UH Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <span class="navbar-brand">Superadmin Dashboard</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </nav>

    <div class="container">
        <ul class="nav nav-tabs mb-4" id="dashboardTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="appointments-tab" data-bs-toggle="tab" data-bs-target="#appointments-view" type="button">Appointment View</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="calendar-tab" data-bs-toggle="tab" data-bs-target="#calendar-view" type="button">Calendar View</button>
            </li>
        </ul>

        <div class="tab-content" id="dashboardContent">
            <div class="tab-pane fade show active" id="appointments-view">
                <h3>All Appointments</h3>
                <div class="table-responsive bg-white p-3 rounded shadow-sm">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Camp</th>
                                <th>Building</th>
                                <th>Date & Time</th>
                                <th>Purpose</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="superadmin-appointments-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="calendar-view">
                <h3>Calendar Schedule</h3>
                <div id="calendar-container" class="bg-white p-4 rounded shadow-sm">
                    <div id="calendar-events-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadDashboardData() {
            try {
                const res = await fetch('/api/state');
                const state = await res.json();
                const bookings = state.bookings || [];

                const tbody = document.getElementById('superadmin-appointments-tbody');
                const calendarList = document.getElementById('calendar-events-list');
                tbody.innerHTML = '';
                calendarList.innerHTML = '';

                bookings.forEach(b => {
                    const code = b.confirmationCode || b.confirmation_code;
                    const statusBadge = `<span class="badge bg-${b.status === 'Confirmed' ? 'success' : b.status === 'Cancelled' ? 'danger' : b.status === 'Rescheduled' ? 'warning text-dark' : 'secondary'}">${b.status || 'Pending'}</span>`;
                    
                    const actionButtons = `
                        <div class="btn-group btn-group-sm" role="group">
                            <button class="btn btn-outline-success" onclick="updateStatus('${code}', 'Confirmed')">Confirm</button>
                            <button class="btn btn-outline-warning text-dark" onclick="rescheduleBooking('${code}', '${b.date}', '${b.time || ''}')">Reschedule</button>
                            <button class="btn btn-outline-danger" onclick="updateStatus('${code}', 'Cancelled')">Cancel</button>
                        </div>
                    `;

                    tbody.innerHTML += `
                        <tr>
                            <td><code>${code}</code></td>
                            <td>${b.fullName || b.name || 'N/A'}</td>
                            <td>${b.camp}</td>
                            <td>${b.building}</td>
                            <td>${b.date} ${b.time || ''}</td>
                            <td>${b.purpose}</td>
                            <td>${statusBadge}</td>
                            <td>${actionButtons}</td>
                        </tr>
                    `;

                    calendarList.innerHTML += `
                        <div class="border-bottom py-2 d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${b.date} at ${b.time || 'All Day'}</strong> - ${b.camp} Bldg ${b.building} (${b.purpose}) 
                                <span class="text-muted">[User: ${b.fullName || b.name}]</span><br>
                                Status: ${statusBadge}
                            </div>
                            <div>${actionButtons}</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Failed to load state:", err);
            }
        }

        async function updateStatus(confirmationCode, newStatus, extraData = {}) {
            try {
                const res = await fetch('/api/bookings/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confirmationCode, status: newStatus, ...extraData })
                });

                const data = await res.json();
                if (!res.ok || data.status !== 'success') {
                    alert('Error updating status: ' + (data.error || 'Unauthorized'));
                }
                loadDashboardData();
            } catch (err) {
                console.error('Network error:', err);
            }
        }

        function rescheduleBooking(confirmationCode, currentDate, currentTime) {
            const newDate = prompt("Enter new date (YYYY-MM-DD):", currentDate);
            if (!newDate) return;
            const newTime = prompt("Enter new time (HH:MM):", currentTime);
            if (newTime === null) return;

            updateStatus(confirmationCode, 'Rescheduled', { date: newDate, time: newTime });
        }

        loadDashboardData();
    </script>
</body>
</html>
