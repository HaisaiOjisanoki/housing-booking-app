<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Superadmin Dashboard - UH Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4 mb-4">
        <span class="navbar-brand">Superadmin Dashboard</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </nav>

    <div class="container">
        <!-- View Toggle Buttons -->
        <ul class="nav nav-tabs mb-4" id="dashboardTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="appointments-tab" data-bs-toggle="tab" data-bs-target="#appointments-view" type="button">Appointment View</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="calendar-tab" data-bs-toggle="tab" data-bs-target="#calendar-view" type="button">Calendar View</button>
            </li>
        </ul>

        <div class="tab-content" id="dashboardContent">
            <!-- Appointment Table View -->
            <div class="tab-pane fade show active" id="appointments-view">
                <h3>All Appointments</h3>
                <div class="table-responsive bg-white p-3 rounded shadow-sm">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th>Camp</th>
                                <th>Building</th>
                                <th>Date & Time</th>
                                <th>Purpose</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="superadmin-appointments-tbody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Calendar View -->
            <div class="tab-pane fade" id="calendar-view">
                <h3>Calendar Schedule</h3>
                <div id="calendar-container" class="bg-white p-4 rounded shadow-sm">
                    <!-- Calendar Grid or Event List populated via JS -->
                    <div id="calendar-events-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadDashboardData() {
            try {
                const res = await fetch('/api/state');
                const state = await res.json();
                const bookings = state.bookings || [];

                const tbody = document.getElementById('superadmin-appointments-tbody');
                const calendarList = document.getElementById('calendar-events-list');
                tbody.innerHTML = '';
                calendarList.innerHTML = '';

                bookings.forEach(b => {
                    const code = b.confirmationCode || b.confirmation_code;
                    
                    // Build status dropdown helper function
                    const statusDropdown = `
                        <select class="form-select form-select-sm status-update-select" data-code="${code}">
                            <option value="Pending" ${b.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Confirmed" ${b.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                            <option value="Completed" ${b.status === 'Completed' ? 'selected' : ''}>Completed</option>
                            <option value="Cancelled" ${b.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                        </select>
                    `;

                    // Populate Table View Row
                    tbody.innerHTML += `
                        <tr>
                            <td><code>${code}</code></td>
                            <td>${b.fullName || b.name || 'N/A'}</td>
                            <td>${b.camp}</td>
                            <td>${b.building}</td>
                            <td>${b.date} ${b.time || ''}</td>
                            <td>${b.purpose}</td>
                            <td>${statusDropdown}</td>
                        </tr>
                    `;

                    // Populate Calendar View item representation
                    calendarList.innerHTML += `
                        <div class="border-bottom py-2 d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${b.date} at ${b.time || 'All Day'}</strong> - ${b.camp} Bldg ${b.building} (${b.purpose}) 
                                <span class="text-muted">[User: ${b.fullName || b.name}]</span>
                            </div>
                            <div>${statusDropdown}</div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Failed to load state:", err);
            }
        }

        // Global Event Listener for status updates from either view
        document.addEventListener('change', async function(e) {
            if (e.target && e.target.classList.contains('status-update-select')) {
                const confirmationCode = e.target.getAttribute('data-code');
                const newStatus = e.target.value;

                const res = await fetch('/api/bookings/status', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confirmationCode, status: newStatus })
                });

                const data = await res.json();
                if (!res.ok || data.status !== 'success') {
                    alert('Error updating status: ' + (data.error || 'Unauthorized'));
                    loadDashboardData();
                } else {
                    // Sync selections if multiple views display the same record
                    document.querySelectorAll(`[data-code="${confirmationCode}"]`).forEach(el => {
                        el.value = newStatus;
                    });
                }
            }
        });

        loadDashboardData();
    </script>
</body>
</html>
